# FPT Cost Brain 2.0 - Infrastructure Docker Compose
# Run with: docker-compose up -d
#
# NOTE: Frontend and Backend run locally for development:
#   - Backend: cd backend && uvicorn app.main:app --reload --host 0.0.0.0 --port 8000
#   - Frontend: cd frontend && npm run dev

services:
  # ===== PostgreSQL 16 =====
  postgres:
    image: postgres:16-alpine
    container_name: fpt-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-fpt}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-fpt}
      - POSTGRES_DB=${POSTGRES_DB:-fpt_cost_brain}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-fpt} -d ${POSTGRES_DB:-fpt_cost_brain}",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fpt-network
    restart: unless-stopped

  # ===== Redis 7 =====
  redis:
    image: redis:7-alpine
    container_name: fpt-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - fpt-network
    restart: unless-stopped

  # ===== Qdrant Vector Database =====
  qdrant:
    image: qdrant/qdrant:latest
    container_name: fpt-qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    environment:
      - QDRANT__LOG_LEVEL=INFO
    networks:
      - fpt-network
    restart: unless-stopped

networks:
  fpt-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  qdrant_data:
